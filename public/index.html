<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVERWATCH</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230c0c0c'/><path d='M16 6l9 15.5H7z' fill='%23d4111a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --panel: #ffffff; --panel-2: #f2f2f2; --line: #e2e2e2;
    --text: #0c0c0c; --muted: #555555; --dim: #8a8a8a;
    --brand: #d4111a; --bar: #0c0c0c;
    --accent: #0c0c0c; --accent-soft: #f2f2f2;
    --up: #0f7a3a; --down: #c62828; --amber: #9a5b00; --amber-soft: #fdf4e3;
    --far-left: #1e2f8a; --left: #1d4ed8; --lean-left: #5b8def; --center: #6b7280; --lean-right: #e06055; --right: #c42a1c; --far-right: #7a1610;
    --sans: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --serif: var(--sans); --mono: var(--sans);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px; }

  /* top bar */
  .topbar { background: var(--bar); color: #fff; position: sticky; top: 0; z-index: 30; }
  .bar { display: flex; align-items: stretch; gap: 22px; height: 56px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 22px; letter-spacing: -.01em; flex: none; }
  .brand svg { width: 18px; height: 18px; }
  nav.desks { display: flex; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  nav.desks::-webkit-scrollbar { display: none; }
  nav.desks button { padding: 0 12px; font-size: 14px; font-weight: 700; color: #d6d6d6; white-space: nowrap; border-bottom: 3px solid transparent; border-top: 3px solid transparent; }
  nav.desks button:hover { color: #fff; }
  nav.desks button.on { color: #fff; border-bottom-color: var(--brand); }
  .bar-date { display: flex; align-items: center; font-size: 12px; color: #a8a8a8; white-space: nowrap; flex: none; }
  @media (max-width: 900px) {
    .bar { flex-wrap: wrap; height: auto; gap: 0; }
    .brand { height: 48px; flex: 1; }
    .bar-date { height: 48px; }
    nav.desks { order: 3; flex-basis: 100%; height: 42px; border-top: 1px solid #262626; margin: 0 -20px; padding: 0 8px; }
  }

  /* trending row */
  .subbar { border-bottom: 1px solid var(--line); }
  .chips { display: flex; gap: 2px 16px; align-items: center; overflow-x: auto; scrollbar-width: none; height: 40px; font-size: 13px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips .lbl { font-weight: 800; color: var(--text); flex: none; }
  .chip { color: var(--muted); font-weight: 500; white-space: nowrap; padding: 4px 0; border-bottom: 2px solid transparent; }
  .chip:hover { color: var(--text); }
  .chip.on { color: var(--text); font-weight: 700; border-bottom-color: var(--brand); }

  /* markets ticker */
  .ticker { background: var(--panel-2); border-bottom: 1px solid var(--line); overflow: hidden; white-space: nowrap; font-size: 12.5px; height: 34px; display: flex; align-items: center; }
  .ticker-label { flex: none; padding: 0 12px; height: 100%; display: flex; align-items: center; background: var(--brand); color: #fff; font-weight: 800; font-size: 11px; letter-spacing: .06em; z-index: 1; }
  .ticker-track { display: inline-flex; gap: 32px; padding-left: 24px; animation: scroll 120s linear infinite; }
  .ticker:hover .ticker-track { animation-play-state: paused; }
  .ticker-item { color: var(--muted); } .ticker-item b { color: var(--text); }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* edition strip */
  .edition { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 0; font-size: 13px; color: var(--muted); }
  .ed-name { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--text); font-size: 14px; }
  .live { background: var(--brand); color: #fff; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; padding: 3px 6px; display: inline-flex; align-items: center; gap: 5px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .slots { display: flex; gap: 12px; }
  .slot { color: var(--dim); }
  .slot.past { color: var(--muted); }
  .slot.now { color: var(--text); font-weight: 700; }
  .next b { color: var(--text); font-weight: 600; }

  /* layout */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 336px; gap: 32px; padding: 4px 0 60px; }
  @media (max-width: 1040px) { main { grid-template-columns: 1fr; } }

  .kicker { font-size: 12px; color: var(--dim); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .kicker .src { color: var(--muted); font-weight: 700; }
  .kicker .t::before { content: '·'; margin-right: 6px; }
  .tagpill { color: var(--brand); font-weight: 700; }

  .lean { padding: 1px 5px; color: #fff; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .lean.far-left { background: var(--far-left); } .lean.left { background: var(--left); } .lean.lean-left { background: var(--lean-left); }
  .lean.center { background: var(--center); }
  .lean.lean-right { background: var(--lean-right); } .lean.right { background: var(--right); } .lean.far-right { background: var(--far-right); }

  a:hover h1, a:hover h2, a:hover h3, a:hover h4 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  img { display: block; }

  /* top of page: hero + headlines rail */
  .top { display: grid; grid-template-columns: 250px minmax(0, 1fr); grid-template-areas: "rail hero"; gap: 28px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
  .hero { grid-area: hero; }
  .rail { grid-area: rail; }
  @media (max-width: 760px) { .top { grid-template-columns: 1fr; grid-template-areas: "hero" "rail"; } }
  .hero img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--panel-2); }
  .hero h1 { font-size: clamp(28px, 3.6vw, 44px); line-height: 1.08; letter-spacing: -.02em; font-weight: 900; margin: 12px 0 10px; }
  .hero p { color: var(--muted); line-height: 1.5; font-size: 16px; margin: 0 0 6px; }
  .subs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }
  @media (max-width: 520px) { .subs { grid-template-columns: 1fr; } }
  .rail-h, .sec-h h2 { font-size: 20px; font-weight: 900; letter-spacing: -.01em; margin: 0; }
  .rail-h { padding-bottom: 8px; border-bottom: 3px solid var(--text); }
  .rail-item { display: block; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .rail-item h4 { font-size: 15px; line-height: 1.3; font-weight: 700; margin: 0; }
  .rail-item:first-of-type h4 { font-size: 17px; }

  /* sections */
  .sec { padding: 26px 0 8px; border-bottom: 1px solid var(--line); }
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  .sec-h h2::before { content: ''; display: inline-block; width: 4px; height: 18px; background: var(--brand); margin-right: 10px; vertical-align: -2px; }
  .sec-h button { font-size: 13px; font-weight: 700; color: var(--muted); }
  .sec-h button:hover { color: var(--text); }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  @media (max-width: 900px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .cards { grid-template-columns: 1fr; } }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--panel-2); margin-bottom: 10px; }
  .card h3 { font-size: 16px; line-height: 1.28; margin: 0; font-weight: 800; letter-spacing: -.005em; }
  .subs .card h3 { font-size: 18px; }
  .list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; margin-top: 18px; }
  @media (max-width: 700px) { .list { grid-template-columns: 1fr; } }
  .row { padding: 12px 0; border-top: 1px solid var(--line); }
  .row h4 { font-weight: 700; font-size: 15px; line-height: 1.32; margin: 0; }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; font-size: 14px; }

  /* side column */
  aside { display: flex; flex-direction: column; gap: 28px; align-self: start; }
  .box { background: var(--panel); border-top: 3px solid var(--text); }
  .box-sub { font-size: 12px; color: var(--muted); margin: 2px 0 0; }

  /* spin check */
  .spin-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 0; }
  .spin-head h2, .odds-head h2 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: -.01em; }
  .pager { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .pager button { width: 28px; height: 28px; border: 1px solid var(--line); font-size: 15px; color: var(--muted); }
  .pager button:hover { color: var(--text); border-color: var(--text); }
  .spin-body { padding: 10px 0 14px; }
  .spin-title { font-size: 18px; line-height: 1.25; font-weight: 800; margin: 2px 0 10px; }
  .outlet { display: block; padding: 9px 0; border-top: 1px solid var(--line); }
  .o-meta { display: flex; gap: 8px; align-items: center; font-size: 11px; }
  .o-src { font-weight: 800; }
  .o-title { font-size: 14px; line-height: 1.35; margin-top: 3px; }
  .outlet:hover .o-title { text-decoration: underline; }

  /* horseshoe */
  .shoe { margin: 0 0 6px; }
  .shoe svg { width: 100%; height: auto; display: block; }
  .shoe text { font-size: 9.5px; fill: var(--muted); text-transform: uppercase; font-weight: 600; }
  .shoe .mid { font-size: 11px; fill: var(--dim); text-transform: none; font-weight: 500; }
  .shoe-note { margin-top: 10px; padding: 10px 12px; background: #eef3fd; color: #1a3f8f; font-size: 13px; line-height: 1.45; }
  .shoe-note b, .spin-note b { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 3px; }

  .spin-note { margin-top: 12px; padding: 10px 12px; background: var(--amber-soft); color: var(--amber); font-size: 13px; line-height: 1.45; }
  .spin-note.plain { background: var(--panel-2); color: var(--muted); }
  .facts { margin-top: 12px; font-size: 13px; }
  .fact { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; padding: 6px 0; line-height: 1.35; }
  .fact small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
  .fact .ic { font-weight: 800; } .fact.ok .ic { color: var(--up); } .fact.q .ic { color: var(--amber); }
  .spin-mkt { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; background: var(--panel-2); }
  .spin-mkt div { flex: 1; font-size: 12.5px; line-height: 1.3; font-weight: 600; }
  .spin-mkt small { display: block; color: var(--dim); font-size: 10.5px; margin-top: 2px; font-weight: 500; }
  .spin-mkt .p { font-weight: 900; font-size: 22px; flex: none; }
  .spin-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn { flex: 1; padding: 10px; border: 1px solid var(--line); font-size: 13px; font-weight: 700; text-align: center; }
  .btn.primary { background: var(--text); color: #fff; border-color: var(--text); }
  .btn:hover { opacity: .88; }
  .dots { display: flex; justify-content: center; gap: 6px; padding-bottom: 6px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--text); }

  /* odds */
  .odds-head { padding: 12px 0 0; }
  .odds-head h2 { display: flex; justify-content: space-between; align-items: baseline; }
  .odds-head small { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .odds-tabs { display: flex; gap: 18px; padding: 10px 0 0; border-bottom: 1px solid var(--line); }
  .odds-tabs button { font-size: 13px; font-weight: 700; padding: 6px 0; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .odds-tabs button.on { color: var(--text); border-bottom-color: var(--brand); }
  .odds-list { max-height: 760px; overflow-y: auto; padding: 0 0 8px; }
  .mkt { display: block; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .mkt:last-child { border-bottom: 0; }
  .mkt-top { display: flex; gap: 10px; align-items: flex-start; }
  .mkt-top img { width: 36px; height: 36px; object-fit: cover; flex: none; background: var(--panel-2); }
  .mkt-title { font-size: 14px; font-weight: 700; line-height: 1.3; }
  .mkt:hover .mkt-title { text-decoration: underline; }
  .mkt-vol { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .big-pct { margin-left: auto; text-align: right; font-weight: 900; font-size: 24px; line-height: 1; }
  .big-pct small { display: block; font-size: 10px; color: var(--dim); font-weight: 600; margin-top: 4px; }
  .outs { margin-top: 10px; display: grid; gap: 5px; }
  .out { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 8px; font-size: 12.5px; position: relative; padding: 5px 8px; overflow: hidden; background: var(--panel-2); }
  .out .bar { position: absolute; inset: 0 auto 0 0; background: #e3e3e3; border-right: 2px solid var(--text); }
  .out span { position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .out .p { font-weight: 800; }
  .chg { font-size: 11px; min-width: 44px; text-align: right; font-weight: 600; }
  .chg.up { color: var(--up); } .chg.down { color: var(--down); } .chg.flat { color: var(--dim); }
  .bin-bar { height: 5px; background: rgba(198,40,40,.18); margin-top: 10px; overflow: hidden; }
  .bin-bar i { display: block; height: 100%; background: var(--up); }

  /* in-site reader */
  .reader-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
  .reader { position: fixed; top: 0; right: 0; bottom: 0; width: min(820px, 100%); background: var(--panel); transform: translateX(100%); transition: transform .25s ease; z-index: 41; display: flex; flex-direction: column; }
  body.reading .reader-bg { opacity: 1; pointer-events: auto; }
  body.reading .reader { transform: none; }
  body.reading { overflow: hidden; }
  .reader-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bar); color: #fff; font-size: 12px; }
  .reader-bar .o-src { font-weight: 800; font-size: 13px; }
  .reader-bar .sp { flex: 1; }
  .reader-bar a, .reader-bar button { padding: 7px 10px; border: 1px solid #3a3a3a; font-size: 12px; font-weight: 700; color: #fff; }
  .reader-bar a:hover, .reader-bar button:hover { border-color: #fff; }
  .reader-body { flex: 1; overflow-y: auto; }
  .reader iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .reader-card { max-width: 660px; margin: 0 auto; padding: 28px 24px 40px; }
  .reader-card img { width: 100%; margin-bottom: 18px; background: var(--panel-2); }
  .reader-card h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.1; letter-spacing: -.02em; font-weight: 900; margin: 8px 0 14px; }
  .reader-card p { font-size: 17px; line-height: 1.6; color: var(--muted); }
  .reader-card .go { display: inline-block; margin-top: 10px; padding: 12px 18px; background: var(--brand); color: #fff; font-weight: 700; }
  .reader-card small { display: block; margin-top: 16px; color: var(--dim); font-size: 12px; }

  footer { background: var(--bar); color: #a8a8a8; font-size: 12px; margin-top: 20px; }
  footer .wrap { padding-top: 28px; padding-bottom: 40px; }
  footer .brand { color: #fff; margin-bottom: 14px; }
  footer p { max-width: 720px; line-height: 1.5; }
  .srcs { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; }
  .srcs .bad { color: #ff7b72; }
  .loading { min-height: 50vh; display: grid; place-items: center; color: var(--muted); font-size: 14px; }

  /* bias scanner */
  .scan { max-width: 860px; padding-top: 8px; }
  .scan h2 { font-size: 36px; font-weight: 900; letter-spacing: -.02em; margin: 4px 0 6px; }
  .scan .lede { color: var(--muted); margin: 0 0 18px; line-height: 1.5; font-size: 16px; }
  .scan-label { display: block; font-weight: 700; font-size: 14px; margin: 16px 0 6px; }
  .scan-label span { font-weight: 400; color: var(--dim); }
  .scan-input, .scan textarea { width: 100%; padding: 12px 14px; font: inherit; font-size: 15px; border: 1px solid #cfcfcf; background: var(--panel); color: var(--text); border-radius: 0; }
  .scan textarea { min-height: 220px; font-size: 14px; }
  .scan-input:focus, .scan textarea:focus { outline: 2px solid var(--text); outline-offset: -1px; }
  .scan-src { min-height: 20px; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .scan-src span { color: var(--dim); }
  .scan .paste { display: flex; justify-content: flex-end; margin-top: 10px; }
  .scan .paste button { padding: 12px 22px; background: var(--brand); color: #fff; font-weight: 800; }
  .scan-err { margin-top: 14px; padding: 12px 14px; background: #fdecea; color: var(--down); font-size: 14px; }
  .ai-badge, .word-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-left: 8px; padding: 2px 6px; }
  .ai-badge { background: #eef3fd; color: #1a3f8f; }
  .word-badge { background: var(--panel-2); color: var(--muted); }
  .verdict .ai-badge { margin: 0 6px 0 0; vertical-align: 2px; }
  .verdict.ai-verdict { font-weight: 400; font-size: 15px; line-height: 1.5; }
  .meter i.ai { background: #1d4ed8; }
  .missing { margin-top: 18px; padding: 14px 16px; background: var(--panel-2); font-size: 14px; }
  .missing ul { margin: 6px 0 0; padding-left: 18px; line-height: 1.5; color: var(--muted); }
  .scan-res { margin-top: 28px; border-top: 3px solid var(--text); padding-top: 14px; }
  .scan-res .src { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 14px; }
  .meter { position: relative; height: 10px; background: linear-gradient(90deg, var(--far-left), var(--lean-left) 35%, var(--center) 50%, var(--lean-right) 65%, var(--far-right)); }
  .meter i { position: absolute; top: -5px; width: 4px; height: 20px; background: var(--text); transform: translateX(-2px); box-shadow: 0 0 0 2px var(--bg); }
  .meter-labels { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; margin-top: 6px; }
  .verdict { font-size: 17px; font-weight: 700; margin: 14px 0 10px; }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; }
  .counts button { padding: 7px 12px; border: 1px solid var(--line); font-size: 13px; font-weight: 700; background: var(--panel); }
  .counts button.on { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
  .counts .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .caveat { font-size: 12.5px; color: var(--dim); margin: 12px 0 0; line-height: 1.5; }
  .finding { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .finding .tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; font-weight: 800; }
  .finding .tag.b-left { color: var(--left); } .finding .tag.b-right { color: var(--right); } .finding .tag.b-loaded { color: var(--amber); }
  .finding blockquote { margin: 6px 0; font-family: Georgia, serif; font-size: 17px; line-height: 1.5; }
  .finding .why { font-size: 13px; color: var(--muted); line-height: 1.45; }
  .finding .why b { color: var(--text); font-weight: 700; }
  .quoted { font-size: 10px; color: var(--dim); margin-left: 6px; text-transform: uppercase; font-weight: 600; }
  mark.b-left { background: rgba(29,78,216,.13); color: inherit; border-bottom: 2px solid var(--left); }
  mark.b-right { background: rgba(196,42,28,.12); color: inherit; border-bottom: 2px solid var(--right); }
  mark.b-loaded { background: rgba(154,91,0,.13); color: inherit; border-bottom: 2px solid var(--amber); }
  .full-text p { font-family: Georgia, serif; font-size: 17px; line-height: 1.65; }
  .scan-loading { margin-top: 20px; color: var(--muted); font-weight: 600; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 16px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap bar">
    <a class="brand" href="./" aria-label="OVERWATCH home"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 1.5l8 14H1z" fill="#d4111a"/></svg>OVERWATCH</a>
    <nav class="desks" id="desks" aria-label="Sections"></nav>
    <div class="bar-date" id="today"></div>
  </div>
</header>
<div class="subbar"><div class="wrap"><div class="chips" id="chips"></div></div></div>
<div class="ticker"><div class="ticker-label">MARKETS</div><div class="ticker-track" id="tickerTrack"></div></div>

<div class="wrap">
  <div class="edition">
    <span class="live"><span class="live-dot"></span>LIVE</span>
    <span class="ed-name" id="edName">Loading…</span>
    <span class="slots" id="slots"></span>
    <span class="next" id="next"></span>
  </div>

  <main>
    <section id="feed"><div class="loading">Loading the latest edition…</div></section>
    <aside>
      <div class="box" id="spin"></div>
      <div class="box">
        <div class="odds-head"><h2>The Odds <small>via Polymarket</small></h2></div>
        <div class="odds-tabs" id="oddsTabs"></div>
        <div class="odds-list" id="odds"></div>
      </div>
    </aside>
  </main>
</div>

<footer>
  <div class="wrap">
    <div class="brand"><svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path d="M9 1.5l8 14H1z" fill="#d4111a"/></svg>OVERWATCH</div>
    <div id="built"></div>
    <div class="srcs" id="srcs"></div>
    <p>Lean labels are approximate, based on common media-bias charts. Spin Check notes are written by AI from headlines and summaries only. Always read the originals.</p>
  </div>
</footer>
<div class="toast" id="toast"></div>
<div class="reader-bg" data-close-reader></div>
<div class="reader" id="reader" role="dialog" aria-modal="true" aria-label="Article reader"></div>

<script src="scanner.js"></script>
<script>
const DESKS = [
  { id: 'front', label: 'Front Page' },
  { id: 'israel', label: 'Israel & Middle East' },
  { id: 'politics', label: 'US Politics' },
  { id: 'osint', label: 'OSINT & Defense' },
  { id: 'shapiro', label: 'Shapiro / Daily Wire' },
  { id: 'scan', label: 'Bias Scanner' },
];
const TOPICS = ['Israel', 'Iran', 'Gaza', 'Antisemitism', 'Midterms', 'Trump', 'Military', 'Russia/Ukraine', 'China'];
const ODDS_DESKS = [{ id: 'mideast', label: 'Middle East' }, { id: 'us', label: 'US Politics' }, { id: 'world', label: 'World' }];
const SLOT_HOURS = [6, 12, 18];
// Visitor metrics (GoatCounter: free, no cookies). Set to your GoatCounter code, e.g. 'overwatch-news'.
const GOATCOUNTER = 'overwatch-news';
const LEANS = ['far left', 'left', 'lean left', 'center', 'lean right', 'right', 'far right'];
const LEAN_COLORS = { 'far left': '#1e2f8a', left: '#1d4ed8', 'lean left': '#5b8def', center: '#6b7280', 'lean right': '#e06055', right: '#c42a1c', 'far right': '#7a1610' };

const state = { scan: { url: '', text: '', error: '', result: null, filter: null, full: false, ai: {} }, desk: load('desk', 'front'), topic: null, oddsDesk: load('oddsDesk', 'mideast'), spinIdx: 0, edition: null, retryAt: 0 };
function load(k, d) { try { return localStorage.getItem('ow.' + k) || d; } catch { return d; } }
function save(k, v) { try { localStorage.setItem('ow.' + k, v); } catch {} }

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = t => { const m = Math.round((Date.now() - t) / 6e4); return m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`; };
const money = n => n >= 1e6 ? `$${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `$${Math.round(n / 1e3)}K` : `$${n}`;
const fmtPct = p => p >= 99.5 ? '>99%' : p < 1 ? '<1%' : `${Math.round(p)}%`;
const chg = c => c == null || Math.abs(c) < 0.5 ? `<span class="chg flat">—</span>` : `<span class="chg ${c > 0 ? 'up' : 'down'}">${c > 0 ? '▲' : '▼'}${Math.abs(c).toFixed(1)}</span>`;
const leanPill = l => l ? `<span class="lean ${l.replace(' ', '-')}">${esc(l)}</span>` : '';

// Every article we render is registered here so a click can open it in the in-site reader.
const byLink = new Map();
const reg = a => { byLink.set(a.link, a); return a.link; };

function kicker(a) {
  const tag = a.tags?.[0] ? `<span class="tagpill">${esc(a.tags[0])}</span>` : '';
  return `<div class="kicker">${tag}${leanPill(a.lean)}<span class="src">${esc(a.source)}</span><span class="t">${ago(a.published)}</span></div>`;
}
const imgTag = a => a.image ? `<img src="${esc(a.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="imgFailed(this)">` : '';
// A dead image link drops that picture; if it was a top-of-page slot, re-lay out so a story with a working picture leads.
let relayout;
function imgFailed(img) {
  const a = byLink.get(img.closest('a')?.getAttribute('href'));
  const top = img.closest('.hero');
  img.remove();
  if (!a) return;
  a.image = null;
  if (top) { clearTimeout(relayout); relayout = setTimeout(renderFeed, 150); }
}
const link = (a, inner) => `<a href="${esc(reg(a))}" target="_blank" rel="noopener" data-read>${inner}</a>`;

function filtered() {
  let list = state.edition.articles;
  if (state.desk === 'shapiro') list = list.filter(a => a.source === 'The Daily Wire' || a.tags.includes('Shapiro'));
  else if (state.desk !== 'front') list = list.filter(a => a.desk === state.desk);
  if (state.topic) list = list.filter(a => a.tags.includes(state.topic));
  return list;
}

function renderFeed() {
  if (state.desk === 'scan') return renderScanner();
  const list = filtered();
  if (!list.length) { $('feed').innerHTML = `<div class="empty">No stories on this filter in the current edition.</div>`; return; }
  // Each story appears once on the page: take() hands out stories in ranked order and remembers them.
  const used = new Set();
  const take = (pool, n, ok = () => true) => {
    const out = [];
    for (const a of pool) { if (out.length >= n) break; if (!used.has(a) && ok(a)) { used.add(a); out.push(a); } }
    return out;
  };
  const hasImg = a => !!a.image;
  const lead = take(list, 1, hasImg)[0] || take(list, 1)[0];
  const subs = take(list, 2, hasImg);
  const rail = take(list, 9);

  let html = `<div class="top">
      <article class="hero">
        ${link(lead, imgTag(lead))}
        ${link(lead, `<h1>${esc(lead.title)}</h1>`)}
        ${lead.summary ? `<p>${esc(lead.summary)}</p>` : ''}${kicker(lead)}
        ${subs.length ? `<div class="subs">${subs.map(card).join('')}</div>` : ''}
      </article>
      <div class="rail"><h2 class="rail-h">Top headlines</h2>${rail.map(a => `<div class="rail-item">${link(a, `<h4>${esc(a.title)}</h4>`)}${kicker(a)}</div>`).join('')}</div>
    </div>`;

  const section = (title, pool, desk, cards, more) => {
    const c = take(pool, cards, hasImg), m = take(pool, more);
    if (!c.length && !m.length) return '';
    return `<section class="sec">
      <div class="sec-h"><h2>${esc(title)}</h2>${desk ? `<button data-desk="${desk}">See all ›</button>` : ''}</div>
      ${c.length ? `<div class="cards">${c.map(card).join('')}</div>` : ''}
      ${m.length ? `<div class="list">${m.map(row).join('')}</div>` : ''}
    </section>`;
  };
  if (state.desk === 'front' && !state.topic) {
    for (const d of DESKS.slice(1, 5)) {
      const pool = d.id === 'shapiro' ? list.filter(a => a.source === 'The Daily Wire' || a.tags.includes('Shapiro')) : list.filter(a => a.desk === d.id);
      html += section(d.label, pool, d.id, 4, 6);
    }
  } else {
    html += section('More headlines', list, null, 8, 60);
  }
  $('feed').innerHTML = html;
}
const card = a => `<article class="card">${link(a, imgTag(a))}${link(a, `<h3>${esc(a.title)}</h3>`)}${kicker(a)}</article>`;
const row = a => `<div class="row">${link(a, `<h4>${esc(a.title)}</h4>`)}${kicker(a)}</div>`;

function renderSpin() {
  const list = state.edition.spin || [];
  if (!list.length) { $('spin').innerHTML = `<div class="spin-head"><h2>Spin Check</h2></div><div class="empty">No story was covered by both sides this edition.</div>`; return; }
  state.spinIdx = (state.spinIdx + list.length) % list.length;
  const c = list[state.spinIdx];
  const note = c.spin
    ? `<div class="spin-note"><b>The spin</b>${esc(c.spin)}</div>`
    : `<div class="spin-note plain">Same event, ${c.outlets.length} outlets. Compare what each one leads with.</div>`;
  const facts = [
    ...c.confirmed.map(f => `<div class="fact ok"><span class="ic">✓</span><span>${esc(f.claim)}<small>${esc(f.basis)}</small></span></div>`),
    ...c.unverified.map(u => `<div class="fact q"><span class="ic">?</span><span>${esc(u)}<small>Unverified</small></span></div>`),
  ].join('');
  const m = c.market;
  $('spin').innerHTML = `
    <div class="spin-head"><div><h2>Spin Check</h2><p class="box-sub">Same story, every side</p></div>
      <div class="pager"><button data-spin="-1" aria-label="Previous">‹</button>${state.spinIdx + 1}/${list.length}<button data-spin="1" aria-label="Next">›</button></div>
    </div>
    <div class="spin-body">
      <div class="spin-title">${esc(c.headline)}</div>
      ${horseshoe(c)}
      ${c.outlets.map(o => `<a class="outlet" href="${esc(reg(o))}" target="_blank" rel="noopener" data-read><div class="o-meta">${leanPill(o.lean)}<span class="o-src">${esc(o.source)}</span></div><div class="o-title">${esc(o.title)}</div></a>`).join('')}
      ${note}
      ${c.horseshoe ? `<div class="shoe-note"><b>Horseshoe</b>${esc(c.horseshoe)}</div>` : ''}
      ${facts ? `<div class="facts">${facts}</div>` : ''}
      ${m ? `<a class="spin-mkt" href="${esc(m.url)}" target="_blank" rel="noopener"><div>${esc(m.title)}${m.outcome ? ` · ${esc(m.outcome)}` : ''}<small>POLYMARKET ${chg(m.change)}</small></div><span class="p">${fmtPct(m.chance)}</span></a>` : ''}
      <div class="spin-actions"><button class="btn primary" data-share>Share card</button></div>
    </div>
    <div class="dots">${list.map((_, i) => `<i class="${i === state.spinIdx ? 'on' : ''}"></i>`).join('')}</div>`;
}

// ---------- Bias Scanner ----------
// You give the article's link (only to identify the outlet) and paste its text. The word list
// runs in the browser; the AI line analysis runs on the local server when an AI key is set.

const AI_TYPES_LABEL = t => t.charAt(0).toUpperCase() + t.slice(1);

function identifySource(link) {
  let host;
  try { host = new URL(link).hostname.replace(/^www\./, ''); } catch { return null; }
  const known = (state.edition?.sources || []).find(s => (s.domains || []).some(d => host === d || host.endsWith('.' + d)));
  return known ? { name: known.name, lean: known.lean, host } : { name: host, lean: null, host };
}

function markSentence({ sentence, hits }, only) {
  let out = '', at = 0;
  for (const h of hits) {
    if (only && h.side !== only) continue;
    out += esc(sentence.slice(at, h.start)) + `<mark class="${BiasScanner.SIDES[h.side].cls}" title="${esc(h.note)}">${esc(h.text)}</mark>`;
    at = h.end;
  }
  return out + esc(sentence.slice(at));
}

// Highlight an AI quote inside its paragraph (case- and quote-style-insensitive).
function markQuote(text, quote, cls) {
  const fold = t => t.replace(/[“”]/g, '"').replace(/[‘’]/g, "'").toLowerCase();
  const i = fold(text).indexOf(fold(quote));
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + `<mark class="${cls}">${esc(text.slice(i, i + quote.length))}</mark>` + esc(text.slice(i + quote.length));
}

const leanWord = n => n === 0 ? 'balanced' : `${Math.abs(n) >= 3 ? 'strongly ' : Math.abs(n) === 1 ? 'slightly ' : ''}${n < 0 ? 'left' : 'right'}`;

function renderScanner() {
  const sc = state.scan, r = sc.result, src = identifySource(sc.url);
  let html = `<div class="scan">
    <div class="kicker"><span class="src">Tool</span></div>
    <h2>Bias Scanner</h2>
    <p class="lede">Paste the article's link so we know which outlet it's from, then copy and paste the article text. The scanner goes through it line by line and flags framing that leans left, leans right, or is loaded, with a neutral alternative for each.</p>
    <form id="scanForm">
      <label class="scan-label" for="scanUrl">Article link <span>(identifies the outlet)</span></label>
      <input id="scanUrl" class="scan-input" type="url" inputmode="url" placeholder="https://www.example.com/news/article" value="${esc(sc.url)}">
      <div class="scan-src" id="scanSrc">${srcLine(src)}</div>
      <label class="scan-label" for="scanText">Article text <span>(copy the whole article and paste it here)</span></label>
      <textarea id="scanText" placeholder="Paste the article text here">${esc(sc.text)}</textarea>
      <div class="paste"><button type="submit">Scan article</button></div>
    </form>`;
  if (sc.error) html += `<div class="scan-err">${esc(sc.error)}</div>`;
  if (r) {
    const { counts, lean, findings, marked } = r.scan;
    const ai = sc.ai;
    const aiFindings = (ai.data?.findings || []).filter(f => !sc.filter || f.lean === sc.filter);
    const shown = findings.filter(f => !sc.filter || f.side === sc.filter);
    const wordPos = 50 + lean * 50 * Math.min(1, (counts.left + counts.right) / 4); // few signals → stay near the middle
    const n = k => findings.filter(f => f.side === k).length + (ai.data?.findings || []).filter(f => f.lean === k).length;
    html += `<div class="scan-res">
      <div class="src">${r.source.lean ? leanPill(r.source.lean) + ' ' : ''}${esc(r.source.name)}${r.source.lean ? ' · outlet generally rated ' + esc(r.source.lean) : ''}</div>
      <div class="meter">${ai.data ? `<i class="ai" style="left:${50 + ai.data.lean * 50 / 3}%" title="AI read"></i>` : ''}<i style="left:${wordPos.toFixed(1)}%" title="Word choice"></i></div>
      <div class="meter-labels"><span>Left</span><span>Balanced</span><span>Right</span></div>
      <div class="verdict">Word choice: ${esc(BiasScanner.leanVerdict(r.scan))}</div>
      ${ai.data ? `<div class="verdict ai-verdict"><span class="ai-badge">AI read</span> Framing leans ${esc(leanWord(ai.data.lean))}. ${esc(ai.data.summary)}</div>` : ''}
      ${ai.loading ? `<div class="scan-loading">AI IS READING EVERY LINE…</div>` : ''}
      ${ai.error ? `<div class="scan-err">${esc(ai.error)}</div>` : ''}
      ${ai.off ? `<p class="caveat">AI line analysis is off. Add a free AI key to turn it on (see README).</p>` : ''}
      <div class="counts">
        ${['left', 'right', 'loaded'].map(k => `<button data-scan-filter="${k}" class="${sc.filter === k ? 'on' : ''}"><span class="dot" style="background:var(--${k === 'loaded' ? 'amber' : k})"></span>${BiasScanner.SIDES[k].label}: ${n(k)}</button>`).join('')}
        <button data-scan-full class="${sc.full ? 'on' : ''}">${sc.full ? 'Show flagged lines' : 'Show full article'}</button>
      </div>
      <p class="caveat">These are framing signals, not a verdict on the whole article. Sometimes the flagged word is the accurate one. Words inside quotes or attributed to someone ("accused Israel of…", "…, Trump said") are theirs, so the word list doesn't count them (${counts.quoted} this time). The AI only flags lines it can quote exactly from your text${ai.data?.dropped > 0 ? `; ${ai.data.dropped} of its findings were dropped because the quote wasn't in the article` : ''}.</p>`;
    if (sc.full) {
      const aiByP = {};
      (ai.data?.findings || []).forEach(f => { if (!sc.filter || f.lean === sc.filter) (aiByP[f.p] ||= []).push(f); });
      html += `<div class="full-text">${marked.map((sents, i) => {
        const aiHere = aiByP[i];
        if (aiHere) return `<p>${markQuote(r.paragraphs[i], aiHere[0].quote, BiasScanner.SIDES[aiHere[0].lean].cls)}</p>`; // first AI finding per paragraph
        return `<p>${sents.map(x => markSentence(x, sc.filter)).join(' ')}</p>`;
      }).join('')}</div>`;
    } else if (!shown.length && !aiFindings.length) {
      html += `<div class="empty">Nothing flagged${sc.filter ? ' in this category' : ''}.</div>`;
    } else {
      html += aiFindings.map(f => `<div class="finding">
        <span class="tag ${BiasScanner.SIDES[f.lean].cls}">${BiasScanner.SIDES[f.lean].label}</span><span class="ai-badge">AI · ${esc(f.type)}</span>
        <blockquote>${markQuote(r.paragraphs[f.p], f.quote, BiasScanner.SIDES[f.lean].cls)}</blockquote>
        <div class="why">${esc(f.why)}${f.neutral ? ` <b>Neutral:</b> ${esc(f.neutral)}` : ''}</div></div>`).join('');
      html += shown.map(f => `<div class="finding">
        <span class="tag ${BiasScanner.SIDES[f.side].cls}">${BiasScanner.SIDES[f.side].label}</span><span class="word-badge">Word list</span>${f.quoted ? '<span class="quoted">someone else\'s words</span>' : ''}
        <blockquote>${markSentence({ sentence: f.sentence, hits: [f] })}</blockquote>
        <div class="why">${esc(f.note)} <b>Neutral:</b> ${esc(f.neutral)}.</div></div>`).join('');
    }
    if (ai.data?.missing.length) html += `<div class="missing"><b>Context a fair version would add</b><ul>${ai.data.missing.map(m => `<li>${esc(m)}</li>`).join('')}</ul></div>`;
    html += `</div>`;
  }
  $('feed').innerHTML = html + `</div>`;
}

function srcLine(src) {
  if (!src) return '';
  return src.lean ? `Outlet: ${leanPill(src.lean)} <b>${esc(src.name)}</b>` : `Outlet: <b>${esc(src.name)}</b> <span>(not in our source list, so no lean rating)</span>`;
}

async function runScan() {
  const sc = state.scan;
  sc.url = $('scanUrl').value.trim();
  sc.text = $('scanText').value;
  const src = identifySource(sc.url);
  const paragraphs = sc.text.split(/\n\s*\n|\n/).map(t => t.trim()).filter(t => t.length > 20);
  if (!src) { sc.error = 'Paste the article\'s full link (starting with https://) so we know which outlet it is.'; return renderScanner(); }
  if (paragraphs.join(' ').length < 200) { sc.error = 'Paste the article text too: copy the whole article from the site and paste it in the box.'; return renderScanner(); }
  Object.assign(sc, { error: '', filter: null, full: false, ai: { loading: true },
    result: { source: src, paragraphs, scan: BiasScanner.scanText(paragraphs) } });
  track('bias-scan', src.host);
  renderScanner();
  $('feed').querySelector('.scan-res')?.scrollIntoView({ behavior: 'smooth', block: 'start' });

  try {
    const status = await fetch('api/ai-status').then(r => r.ok && (r.headers.get('content-type') || '').includes('json') ? r.json() : { available: false });
    if (!status.available) { sc.ai = { off: true }; return renderScanner(); }
    const res = await fetch('api/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paragraphs, source: src.name, lean: src.lean }) });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    sc.ai = { data };
  } catch (err) {
    sc.ai = { error: 'AI analysis failed: ' + err.message };
  }
  if (state.scan.result?.paragraphs === paragraphs) renderScanner();
}

document.addEventListener('submit', e => {
  if (e.target.id !== 'scanForm') return;
  e.preventDefault();
  runScan();
});
document.addEventListener('input', e => {
  if (e.target.id === 'scanUrl') $('scanSrc').innerHTML = srcLine(identifySource(e.target.value.trim()));
});

function scanFromReader(link) {
  closeReader();
  state.desk = 'scan'; save('desk', 'scan');
  Object.assign(state.scan, { url: link, text: '', result: null, error: '' });
  renderChrome(); renderFeed();
  window.scrollTo({ top: $('desks').offsetTop - 8, behavior: 'smooth' });
  setTimeout(() => $('scanText')?.focus(), 400);
  toast('Now copy the article text and paste it here.');
}

// The 7 lean positions laid out on a horseshoe: center at the bottom, far left and far right
// curling up toward each other at the top.
function shoePoint(i, cx = 150, cy = 92, r = 74) {
  const deg = 232 - i * (284 / 6), rad = deg * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy - r * Math.sin(rad) * -1];
}
function horseshoe(c) {
  const counts = Object.fromEntries(LEANS.map(l => [l, c.outlets.filter(o => o.lean === l).length]));
  const covered = LEANS.filter(l => counts[l]).length;
  const curve = Array.from({ length: 61 }, (_, k) => shoePoint(k / 10).map(n => n.toFixed(1)).join(',')).join(' ');
  const dots = LEANS.map((l, i) => {
    const [x, y] = shoePoint(i), n = counts[l];
    const lx = i < 3 ? x - 9 : i > 3 ? x + 9 : x, anchor = i < 3 ? 'end' : i > 3 ? 'start' : 'middle', ly = i === 3 ? y + 19 : y + 3;
    return `<g><title>${l}: ${n} outlet${n === 1 ? '' : 's'}</title>
      <circle cx="${x}" cy="${y}" r="${n ? 6 + Math.min(n, 3) : 4.5}" fill="${n ? LEAN_COLORS[l] : 'var(--panel)'}" stroke="${n ? 'none' : 'var(--dim)'}" stroke-width="1.2"/>
      ${n > 1 ? `<text x="${x}" y="${y + 3.2}" text-anchor="middle" style="fill:#fff;font-size:9px">${n}</text>` : ''}
      <text x="${lx}" y="${ly}" text-anchor="${anchor}" style="fill:${n ? 'var(--text)' : 'var(--dim)'}">${l}</text></g>`;
  }).join('');
  return `<div class="shoe"><svg viewBox="0 0 300 196" role="img" aria-label="Coverage across the political horseshoe: ${covered} of 7 positions">
    <polyline points="${curve}" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
    ${dots}
    <text class="mid" x="150" y="96" text-anchor="middle">${covered} of 7 positions</text>
    <text class="mid" x="150" y="110" text-anchor="middle">covered this story</text>
  </svg></div>`;
}

const frameable = name => !!state.edition.sources.find(s => s.name === name)?.frameable;

function openReader(href) {
  const a = byLink.get(href);
  if (!a) return false;
  const embed = a.embed || a.link;
  const inSite = frameable(a.source);
  $('reader').innerHTML = `
    <div class="reader-bar">${leanPill(a.lean)}<span class="o-src">${esc(a.source)}</span><span class="sp"></span>
      <button data-scan-link="${esc(a.link)}">Scan for bias</button>
      <a href="${esc(a.link)}" target="_blank" rel="noopener">Open original ↗</a>
      <button data-close-reader aria-label="Close reader">Close ✕</button></div>
    <div class="reader-body">${inSite
      ? `<iframe src="${esc(embed)}" title="${esc(a.title)}" referrerpolicy="no-referrer-when-downgrade"></iframe>`
      : `<div class="reader-card">
          ${a.image ? `<img src="${esc(a.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
          <div class="kicker">${leanPill(a.lean)}<span class="src">${esc(a.source)}</span>${a.published ? `<span class="t">${ago(a.published)}</span>` : ''}</div>
          <h1>${esc(a.title)}</h1>
          ${a.summary ? `<p>${esc(a.summary)}</p>` : ''}
          <a class="go" href="${esc(a.link)}" target="_blank" rel="noopener">Read the full story at ${esc(a.source)} ↗</a>
          <small>${esc(a.source)} doesn't allow its articles to be shown inside other sites, so this is their summary.</small>
        </div>`}</div>`;
  document.body.classList.add('reading');
  track('read-in-site', a.source);
  return true;
}
function closeReader() { document.body.classList.remove('reading'); setTimeout(() => { if (!document.body.classList.contains('reading')) $('reader').innerHTML = ''; }, 300); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReader(); });

function marketHtml(m) {
  const head = `<div class="mkt-top">${m.image ? `<img src="${esc(m.image)}" alt="" loading="lazy">` : ''}<div><div class="mkt-title">${esc(m.title)}</div><div class="mkt-vol">${money(m.volume24h)} 24h vol · ${money(m.volume)} total</div></div>`;
  if (m.binary) {
    const yes = m.outcomes[0];
    return `<a class="mkt" href="${esc(m.url)}" target="_blank" rel="noopener">${head}<div class="big-pct">${fmtPct(yes.chance)}<small>${esc(yes.name).toUpperCase()} ${chg(yes.change)}</small></div></div><div class="bin-bar"><i style="width:${yes.chance}%"></i></div></a>`;
  }
  return `<a class="mkt" href="${esc(m.url)}" target="_blank" rel="noopener">${head}</div><div class="outs">${m.outcomes.slice(0, 4).map(o =>
    `<div class="out"><div class="bar" style="width:${Math.min(o.chance, 100)}%"></div><span>${esc(o.name)}</span><span class="p">${fmtPct(o.chance)}</span>${chg(o.change)}</div>`).join('')}</div></a>`;
}

function renderOdds() {
  $('oddsTabs').innerHTML = ODDS_DESKS.map(d => `<button class="${d.id === state.oddsDesk ? 'on' : ''}" data-od="${d.id}">${d.label}</button>`).join('');
  const list = state.edition.odds.filter(m => m.desk === state.oddsDesk).slice(0, 20);
  $('odds').innerHTML = list.length ? list.map(marketHtml).join('') : `<div class="empty">No open markets.</div>`;
}

function renderTicker() {
  const items = state.edition.odds.slice(0, 18).map(m => {
    const o = m.outcomes[0];
    return `<span class="ticker-item">${esc(m.title)} <b>${esc(m.binary ? '' : o.name + ' ')}${fmtPct(o.chance)}</b> ${chg(o.change)}</span>`;
  }).join('');
  $('tickerTrack').innerHTML = items + items; // doubled for seamless loop
}

function renderChrome() {
  const e = state.edition;
  $('edName').textContent = e.name;
  const slotHour = new Date(e.slot).getHours();
  $('slots').innerHTML = SLOT_HOURS.map(h => `<span class="slot ${h === slotHour ? 'now' : h < slotHour ? 'past' : ''}">${String(h).padStart(2, '0')}:00</span>`).join('');
  $('desks').innerHTML = DESKS.map(d => `<button class="${d.id === state.desk ? 'on' : ''}" data-desk="${d.id}">${d.label}</button>`).join('');
  $('chips').style.display = state.desk === 'scan' ? 'none' : '';
  $('chips').innerHTML = `<span class="lbl">Trending</span>` + TOPICS.map(t => `<button class="chip ${t === state.topic ? 'on' : ''}" data-topic="${t}">${t}</button>`).join('');
  const ok = e.sources.filter(s => s.ok).length;
  $('built').textContent = `${e.name} compiled ${new Date(e.builtAt).toLocaleString()} · ${e.articles.length} stories · ${e.odds.length} markets · ${ok}/${e.sources.length} sources online`;
  $('srcs').innerHTML = e.sources.map(s => `<span class="${s.ok ? '' : 'bad'}">${s.ok ? '●' : '○'} ${esc(s.name)}</span>`).join('');
}

// ---------- share card (drawn in the browser, no server) ----------

function wrapLines(ctx, text, maxW, maxLines) {
  const words = String(text).split(/\s+/), lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] = lines[maxLines - 1].replace(/\s*\S*$/, '') + '…'; }
  return lines;
}

async function drawCard(c) {
  await document.fonts.ready;
  const W = 1080, H = 1350, P = 72, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'top';

  ctx.font = '700 26px Inter'; ctx.fillStyle = '#15171a';
  ctx.fillText('OVERWATCH', P, P); ctx.fillStyle = '#d4111a';
  ctx.fillText('SPIN CHECK', P + ctx.measureText('OVERWATCH  ').width, P);
  let y = P + 64;

  ctx.font = '900 54px Inter'; ctx.fillStyle = '#15171a';
  for (const l of wrapLines(ctx, c.headline, W - 2 * P, 3)) { ctx.fillText(l, P, y); y += 64; }
  y += 24;

  const outlets = c.outlets.slice(0, 5);
  for (const o of outlets) {
    ctx.fillStyle = '#e6e4dc'; ctx.fillRect(P, y, W - 2 * P, 2); y += 22;
    let x = P;
    if (o.lean) {
      ctx.font = '700 20px Inter';
      const lw = ctx.measureText(o.lean.toUpperCase()).width + 20;
      ctx.fillStyle = LEAN_COLORS[o.lean]; ctx.fillRect(x, y, lw, 32);
      ctx.fillStyle = '#fff'; ctx.fillText(o.lean.toUpperCase(), x + 10, y + 6); x += lw + 14;
    }
    ctx.font = '700 22px Inter'; ctx.fillStyle = '#15171a'; ctx.fillText(o.source.toUpperCase(), x, y + 5);
    y += 46;
    ctx.font = '500 32px Inter'; ctx.fillStyle = '#15171a';
    for (const l of wrapLines(ctx, o.title, W - 2 * P, 2)) { ctx.fillText(l, P, y); y += 40; }
    y += 14;
  }

  const note = c.spin || `Same event, ${c.outlets.length} outlets. Compare what each one leads with.`;
  ctx.font = '500 30px Inter';
  const noteLines = wrapLines(ctx, note, W - 2 * P - 48, 4);
  const noteH = 70 + noteLines.length * 40;
  if (y + noteH < H - 190) {
    ctx.fillStyle = c.spin ? '#fdf4e3' : '#f3f2ed'; ctx.fillRect(P, y + 10, W - 2 * P, noteH);
    ctx.fillStyle = c.spin ? '#9a5b00' : '#5f6670';
    ctx.font = '700 20px Inter'; ctx.fillText('THE SPIN', P + 24, y + 30);
    ctx.font = '500 30px Inter'; noteLines.forEach((l, i) => ctx.fillText(l, P + 24, y + 64 + i * 40));
  }

  if (c.market) {
    ctx.fillStyle = '#15171a'; ctx.fillRect(P, H - 170, W - 2 * P, 2);
    ctx.font = '700 64px Inter'; const pct = fmtPct(c.market.chance);
    ctx.fillText(pct, W - P - ctx.measureText(pct).width, H - 140);
    ctx.font = '500 26px Inter'; ctx.fillStyle = '#5f6670';
    wrapLines(ctx, 'Polymarket: ' + c.market.title + (c.market.outcome ? ' · ' + c.market.outcome : ''), W - 2 * P - 220, 2)
      .forEach((l, i) => ctx.fillText(l, P, H - 136 + i * 34));
  }
  ctx.font = '500 20px Inter'; ctx.fillStyle = '#8b919a';
  ctx.fillText((location.host + location.pathname).replace(/\/$/, '').toUpperCase() + ' · READ THE ORIGINALS', P, H - 52);
  return new Promise(r => cv.toBlob(r, 'image/png'));
}

async function shareCard() {
  const c = state.edition.spin[state.spinIdx];
  const blob = await drawCard(c);
  const file = new File([blob], 'overwatch-spin-check.png', { type: 'image/png' });
  track('share-card', c.headline);
  try {
    if (navigator.canShare?.({ files: [file] })) return await navigator.share({ files: [file], title: c.headline, text: `Same story, every side: ${shareUrl()}` });
  } catch (err) { if (err.name === 'AbortError') return; }
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: file.name });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('Card saved. Post it anywhere.');
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2200); }

// ---------- metrics ----------
// Page views come from GoatCounter's script; ?ref=card on shared links shows up as the referrer.
// Events below answer: do people share, flip Spin Checks, open articles, and come back on later days?

function track(name, title = '') {
  try { window.goatcounter?.count?.({ path: name, title, event: true }); } catch {}
}
function startMetrics() {
  if (!GOATCOUNTER) return;
  const s = Object.assign(document.createElement('script'), { async: true, src: 'https://gc.zgo.at/count.js' });
  s.dataset.goatcounter = `https://${GOATCOUNTER}.goatcounter.com/count`;
  s.onload = () => {
    const today = new Date().toDateString();
    let last = null;
    try { last = localStorage.getItem('ow.lastDay'); localStorage.setItem('ow.lastDay', today); } catch {}
    if (last && last !== today) track('returning-visitor', 'Came back on a later day');
  };
  document.head.appendChild(s);
}
const shareUrl = () => location.origin + location.pathname + '?ref=card';

// ---------- clock + loading ----------

function tickClock() {
  $('today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  if (!state.edition) return;
  const ms = state.edition.nextEdition - Date.now();
  if (ms <= 0) {
    $('next').innerHTML = `New edition <b>arriving…</b>`;
    if (Date.now() >= state.retryAt) { state.retryAt = Date.now() + 120000; fetchEdition(); } // poll every 2 min until it lands
    return;
  }
  const h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4), s = Math.floor(ms % 6e4 / 1e3);
  $('next').innerHTML = `Next edition in <b>${h}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s</b>`;
}

let fetching = false;
async function fetchEdition() {
  if (fetching) return; fetching = true;
  try {
    const e = await (await fetch('edition.json?t=' + Date.now(), { cache: 'no-store' })).json();
    if (e.error) throw new Error(e.error);
    state.edition = e;
    renderChrome(); renderFeed(); renderSpin(); renderOdds(); renderTicker();
  } catch (err) {
    if (!state.edition) $('feed').innerHTML = `<div class="empty">Couldn't load the edition (${esc(err.message)}). Retrying…</div>`;
    setTimeout(() => { fetching = false; fetchEdition(); }, 30000); return;
  }
  fetching = false;
}

document.addEventListener('click', e => {
  if (e.target.closest('[data-close-reader]')) return closeReader();
  const art = e.target.closest('a[data-read]');
  if (art && !e.metaKey && !e.ctrlKey && !e.shiftKey && e.button === 0 && openReader(art.getAttribute('href'))) { e.preventDefault(); return; }
  const out = e.target.closest('a.outlet, a.spin-mkt, a.mkt');
  if (out) track(out.classList.contains('outlet') ? 'spin-outlet-click' : 'market-click', out.textContent.trim().slice(0, 80));
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.desk) { state.desk = b.dataset.desk; save('desk', state.desk); }
  else if (b.dataset.topic) state.topic = state.topic === b.dataset.topic ? null : b.dataset.topic;
  else if (b.dataset.od) { state.oddsDesk = b.dataset.od; save('oddsDesk', state.oddsDesk); return renderOdds(); }
  else if (b.dataset.spin) { state.spinIdx += +b.dataset.spin; track('spin-flip'); return renderSpin(); }
  else if ('share' in b.dataset) return shareCard();
  else if (b.dataset.scanLink) return scanFromReader(b.dataset.scanLink);
  else if (b.dataset.scanFilter) { state.scan.filter = state.scan.filter === b.dataset.scanFilter ? null : b.dataset.scanFilter; return renderScanner(); }
  else if ('scanFull' in b.dataset) { state.scan.full = !state.scan.full; return renderScanner(); }
  else return;
  renderChrome(); renderFeed(); window.scrollTo({ top: $('desks').offsetTop - 8, behavior: 'smooth' });
});

tickClock(); setInterval(tickClock, 1000);
fetchEdition();
startMetrics();
</script>
